name: Release

on:
  push:
    branches: [main]

# Permissions required by semantic-release to tag, create releases,
# comment on issues/PRs, and publish to npm with provenance.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is required by @semantic-release/npm (it shells out to `npm`).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted Publishing (OIDC) requires npm CLI ≥ 11.5.
      - name: Upgrade npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # No NPM_TOKEN — auth uses GitHub Actions OIDC against the trusted
      # publisher registered on npmjs.com (see README "Releasing"). The
      # `id-token: write` permission above gives the job an OIDC token.
      - name: Semantic Release
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
