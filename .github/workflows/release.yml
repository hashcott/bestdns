name: Release

on:
  push:
    branches: [main]

# Permissions required by semantic-release to tag, create releases,
# comment on issues/PRs, and publish to npm with provenance.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Skip Husky hook installation in CI. Without this, the commit-msg hook
    # runs commitlint against semantic-release's own release commit
    # (`chore(release): x.y.z [skip ci]`), whose auto-generated body contains
    # long URLs that exceed body-max-line-length.
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is required by @semantic-release/npm (it shells out to `npm`).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Diagnostic step — verifies the NPM_TOKEN secret reached the runner
      # intact and that npm actually accepts it. Never prints the token
      # value; GitHub Actions auto-masks secrets in logs as a second layer.
      - name: Diagnose npm authentication
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "── NPM_TOKEN inspection ────────────────────────────────"
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "✘ NPM_TOKEN is EMPTY — the secret is not set or is blank."
            exit 1
          fi
          echo "✓ NPM_TOKEN is set"
          echo "  length:   ${#NPM_TOKEN} chars"
          echo "  prefix:   ${NPM_TOKEN:0:4}…           (expected: 'npm_')"
          first_char="${NPM_TOKEN:0:1}"
          last_char="${NPM_TOKEN: -1}"
          if [[ "$first_char" =~ [[:space:]] ]]; then echo "  ✘ leading whitespace detected"; fi
          if [[ "$last_char"  =~ [[:space:]] ]]; then echo "  ✘ trailing whitespace detected"; fi
          if printf '%s' "$NPM_TOKEN" | grep -q $'\r'; then echo "  ✘ contains a carriage return (\\r)"; fi
          if printf '%s' "$NPM_TOKEN" | grep -q $'\n'; then echo "  ✘ contains a newline (\\n)"; fi

          echo
          echo "── npm CLI & registry ──────────────────────────────────"
          npm --version
          echo "  registry: $(npm config get registry)"

          echo
          echo "── npm ping (network reachability) ─────────────────────"
          npm ping --registry https://registry.npmjs.org/ || echo "  ✘ ping failed"

          echo
          echo "── npm whoami (does the token authenticate?) ───────────"
          NPMRC="$(mktemp)"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPMRC"
          if WHO=$(npm whoami --userconfig "$NPMRC" --registry https://registry.npmjs.org/ 2>&1); then
            echo "  ✓ authenticated as: $WHO"
          else
            echo "  ✘ npm whoami failed:"
            echo "$WHO" | sed 's/^/    /'
          fi
          rm -f "$NPMRC"

          echo
          echo "── OIDC env (would enable Trusted Publishing if needed) ─"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] \
            && echo "  ✓ OIDC token endpoint available" \
            || echo "  – OIDC token endpoint not available"

      - name: Semantic Release
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is disabled while we get the first publish working —
          # provenance signing left bestdns@1.0.0 in a half-published state.
          # Re-enable later by adding NPM_CONFIG_PROVENANCE back here and
          # `"provenance": true` to publishConfig in package.json.
          NPM_CONFIG_PROVENANCE: "false"
          # Verbose plugin + raw npm output so we can see exactly what
          # `npm publish` does (or what it complains about).
          DEBUG: "semantic-release:*"
          NPM_CONFIG_LOGLEVEL: "verbose"
